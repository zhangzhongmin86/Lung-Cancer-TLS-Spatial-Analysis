name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile scripts/*.py
      - run: python -m json.tool "Construction of constrained multicellular modules.ipynb" > /dev/null
      - run: pytest -q
